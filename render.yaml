services:
  - type: web
    name: importing-ph
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /after-auth
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /after-auth
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_HASH_SECRET
        generateValue: true
      - key: REALTIME_TOKEN_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: REALTIME_DATABASE_POOL_MAX
        value: 2
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: 10
      - key: DATABASE_IDLE_TIMEOUT_SECONDS
        value: 20
