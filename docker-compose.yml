services:
  postgres:
    image: postgres:16-alpine
    container_name: importing-ph-postgres
    ports:
      - "5032:5432"
    environment:
      POSTGRES_DB: importing_ph_dev
      POSTGRES_USER: importing_ph
      POSTGRES_PASSWORD: importing_ph_password
    volumes:
      - importing_ph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U importing_ph -d importing_ph_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  importing_ph_postgres_data:
